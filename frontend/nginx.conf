server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo se resuelve con index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Alternativa a CORS: hacer proxy de /api al backend dentro de la red de compose.
    # Si la activas, construye el frontend con VITE_API_URL=/api
    #
    # location /api/ {
    #     proxy_pass http://backend:8080/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
