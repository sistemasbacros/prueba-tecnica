server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La aplicación usa rutas con hash (#/login, #/contracts/1), así que cualquier
    # ruta del servidor resuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.js se regenera al arrancar el contenedor: que el navegador no lo cachee.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Alternativa a CORS: hacer proxy de /api al backend dentro de la red de compose.
    # Si la activas, arranca el contenedor con API_URL=/api
    #
    # location /api/ {
    #     proxy_pass http://backend:8080/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
